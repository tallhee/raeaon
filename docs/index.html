<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>래아온 비교노트</title>
<meta name="description" content="잠실래미안아이파크 입주자대표회의 업무를 다른 단지의 공고·규정과 비교해 보는 공개 자료실">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1d1f1c; --muted:#686b63; --line:#dcd8cc;
  --accent:#2f5d50; --accent-soft:#e3ece7; --warn:#a2552b; --chip:#efebe0;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141614; --paper:#1c1f1c; --ink:#ecebe6; --muted:#a3a69d; --line:#30342f;
    --accent:#86b8a6; --accent-soft:#223029; --warn:#e0a07a; --chip:#262a25;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif}
header{padding:40px 16px 20px;max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:28px;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;
  padding:12px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
section{display:none} section.on{display:block}
h2{font-size:18px;margin:8px 0 12px}
.lead{color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{font-weight:500;color:var(--muted);background:var(--bg);position:sticky;top:0}
tr.home td{background:var(--accent-soft)}
td.empty{color:var(--muted)}
.tag{display:inline-block;background:var(--chip);border-radius:4px;padding:0 6px;margin:0 4px 2px 0;font-size:12px}
.list{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:500}
.card h3 a{color:var(--ink);text-decoration:none}.card h3 a:hover{text-decoration:underline}
label.meta{display:flex;align-items:center;gap:6px;white-space:nowrap}
.meta{color:var(--muted);font-size:13px}
a{color:var(--accent)}
.status{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ok{color:var(--accent)} .bad{color:var(--warn)}
.empty-state{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
footer{max-width:1100px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>래아온 비교노트</h1>
  <p>다른 아파트 단지의 입주자대표회의·선관위 공고와 운영 규정을 주제별로 모아, 우리 단지 운영과 나란히 비교합니다.</p>
</header>
<nav><div class="in" role="tablist">
  <button role="tab" data-tab="rules" aria-selected="true">주제별 규정 비교</button>
  <button role="tab" data-tab="notices" aria-selected="false">다른 단지 공고</button>
  <button role="tab" data-tab="status" aria-selected="false">수집 상태</button>
</div></nav>

<main>
<section id="rules" class="on">
  <div class="bar" id="ruleTopics"></div>
  <p class="lead" id="ruleLead"></p>
  <div class="tablewrap"><table id="ruleTable"></table></div>
</section>

<section id="notices">
  <p class="lead">K-apt 서울 입찰공고 중 주제 키워드가 들어간 공고를 매일 모읍니다. 공고를 누르면 K-apt 원문과 첨부 공고문으로 이동합니다.</p>
  <div class="bar" id="noticeTopics"></div>
  <div class="bar" id="noticeFilters"></div>
  <div class="bar"><input type="search" id="q" placeholder="단지명·공고명 검색">
    <label class="meta"><input type="checkbox" id="hideWorks" checked> 시설 공사 공고 숨기기</label></div>
  <p class="meta" id="noticeCount"></p>
  <div class="list" id="noticeList"></div>
</section>

<section id="status">
  <div class="status" id="statusGrid"></div>
</section>
</main>
<footer>K-apt 공동주택관리정보시스템의 공개 입찰공고를 자동 수집하며, 규정 비교표는 원문을 확인해 직접 정리합니다. 각 항목의 출처 링크를 함께 확인하세요.</footer>

<script>
const TOPICS={parking:"주차규정",community:"커뮤니티",dining:"커뮤니티 식당",governance:"입대의·선관위"};
const FILTERS={seoul_new:"서울 2020년 이후 입주",songpa_gangnam_large:"송파·강남권 대단지"};
const COLS={
  parking:[["public_facility_users_allowed","공공개방시설 이용자 주차"],["visitor_fee","방문차량 요금"],["per_unit_by_area","면적별 세대당 대수·요금"],["notes","비고"]],
  community:[["hours","운영시간"],["fee","요금"],["entry_limit","입장 횟수"],["notes","비고"]],
  dining:[["operator_selection","업체 선정"],["hours","운영시간"],["price","요금"],["notes","비고"]]
};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=p=>fetch(p,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.tab));
});

function chips(el,map,state,onChange,multi){
  el.innerHTML="";
  Object.entries(map).forEach(([k,v])=>{
    const c=document.createElement("button");c.className="chip";c.textContent=v;
    c.setAttribute("aria-pressed",state.has(k));
    c.onclick=()=>{ if(!multi){state.clear();state.add(k);} else state.has(k)?state.delete(k):state.add(k);
      chips(el,map,state,onChange,multi);onChange();};
    el.appendChild(c);
  });
}

(async()=>{
  const [rules,notices,status]=await Promise.all([
    get("data/rules.json"),get("data/notices.json"),get("data/run_status.json")]);

  // 규정 비교
  const rt=new Set(["parking"]);
  const drawRules=()=>{
    const t=[...rt][0],cols=COLS[t],rows=(rules?.complexes)||[];
    document.getElementById("ruleLead").textContent=
      `${rows.length}개 단지 · 원문을 확인한 값만 표시하며, 빈 칸은 아직 확인 전입니다.`;
    document.getElementById("ruleTable").innerHTML=
      `<tr><th>단지</th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th>출처</th></tr>`+
      rows.map(r=>{const d=r[t]||{};
        return `<tr class="${r.is_home?"home":""}"><td><strong>${esc(r.name)}</strong><div class="meta">${esc(r.sigungu||"")}${r.households?` · ${r.households}세대`:""}${r.use_approval?` · ${esc(r.use_approval).slice(0,4)}년`:""}</div></td>`+
        cols.map(c=>d[c[0]]==null?`<td class="empty">–</td>`:`<td>${esc(d[c[0]])}</td>`).join("")+
        `<td>${d.source?`<a href="${esc(d.source)}" target="_blank" rel="noopener">원문</a><div class="meta">${esc(d.checked||"")}</div>`:`<span class="meta">–</span>`}</td></tr>`;}).join("");
  };
  chips(document.getElementById("ruleTopics"),{parking:TOPICS.parking,community:TOPICS.community,dining:TOPICS.dining},rt,drawRules,false);
  drawRules();

  // 공고
  const nt=new Set(),nf=new Set(),q=document.getElementById("q"),hw=document.getElementById("hideWorks");
  const drawNotices=()=>{
    const term=q.value.trim();
    const items=((notices?.items)||[]).filter(n=>
      (!hw.checked||!n.is_works)&&
      (!nt.size||n.topics.some(x=>nt.has(x)))&&
      (!nf.size||(n.filters||[]).some(x=>nf.has(x)))&&
      (!term||(n.title+n.complex_name).includes(term)));
    document.getElementById("noticeCount").textContent=notices?`${items.length}건 · 최근 수집 ${notices.updated?.slice(0,16).replace("T"," ")}`:"";
    const el=document.getElementById("noticeList");
    el.innerHTML=items.length?items.slice(0,300).map(n=>{
      const cx=[n.sigungu,n.households?`${n.households.toLocaleString()}세대`:"",n.use_approval?`${n.use_approval.slice(0,4)}년 승인`:""].filter(Boolean).join(" · ");
      return `<article class="card">
      <h3><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></h3>
      <div class="meta"><strong>${esc(n.complex_name||"단지명 미상")}</strong>${cx?` (${esc(cx)})`:""} · 공고일 ${esc(n.date||"–")}${n.deadline?` · 마감 ${esc(n.deadline)}`:""}${n.category?` · ${esc(n.category)}`:""}</div>
      <div>${n.topics.map(x=>`<span class="tag">${TOPICS[x]||x}</span>`).join("")}${(n.filters||[]).map(x=>`<span class="tag">${FILTERS[x]||x}</span>`).join("")}</div>
      </article>`;}).join(""):`<div class="empty-state">${notices?"조건에 맞는 공고가 없습니다.":"아직 수집된 공고가 없습니다. 첫 수집이 끝나면 여기에 나타납니다."}</div>`;
  };
  chips(document.getElementById("noticeTopics"),TOPICS,nt,drawNotices,true);
  chips(document.getElementById("noticeFilters"),FILTERS,nf,drawNotices,true);
  q.oninput=drawNotices; hw.onchange=drawNotices; drawNotices();

  // 상태
  const names={search:"공고 검색",detail:"공고 상세",complex:"단지 정보(사용승인일)"};
  const desc=s=>s.found!=null?`검색 ${s.found}건 → 주제 일치 ${s.matched}건`:s.new!=null?`새 공고 ${s.new}건`:s.updated!=null?`새로 확인 ${s.updated}곳`:"";
  document.getElementById("statusGrid").innerHTML=status?Object.entries(status.steps||{}).map(([k,s])=>
    `<div class="card"><h3>${names[k]||k}</h3><div class="${s.ok?"ok":"bad"}">${s.ok?"정상":"일부 실패"}</div><div class="meta">${esc(desc(s))}${s.error?` · ${esc(s.error)}`:""}${(s.errors&&s.errors.length)?` · 오류 ${esc(Array.isArray(s.errors)?s.errors.join(", "):s.errors)}`:""}</div></div>`).join("")+
    `<div class="card"><h3>마지막 실행</h3><div class="meta">${esc(status.ran_at)}<br>누적 공고 ${status.totals?.notices??"–"}건 · 단지 ${status.totals?.complexes??"–"}곳</div></div>`
    :`<div class="empty-state">아직 수집을 실행하지 않았습니다.</div>`;
})();
</script>
</body>
</html>
