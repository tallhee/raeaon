name: 공고 수집

on:
  schedule:
    - cron: "47 21 * * *"   # 매일 06:47 KST
    - cron: "17 3,9,15 * * *"  # 첫 수집이 끝날 때까지 이어받기 (12:17·18:17·00:17 KST, 완료 후엔 금방 끝남)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 실행
        run: python scripts/collect.py

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "raeaon-bot"
          git config user.email "raeaon-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 공고 수집 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
